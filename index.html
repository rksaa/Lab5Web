<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Project - Kalkulator Nilai Mahasiswa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .card {
      border: 1px solid #ccc;
      padding: 20px;
      max-width: 400px;
      border-radius: 8px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
    }
    .form-group input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #0056b3;
    }
    #hasil {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    .lulus {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .gagal {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .error {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Kalkulator Nilai Mahasiswa</h2>
    
    <form id="formNilai">
      <div class="form-group">
        <label for="tugas">Nilai Tugas (30%):</label>
        <input type="number" id="tugas" min="0" max="100" placeholder="0 - 100" required>
      </div>

      <div class="form-group">
        <label for="uts">Nilai UTS (30%):</label>
        <input type="number" id="uts" min="0" max="100" placeholder="0 - 100" required>
      </div>

      <div class="form-group">
        <label for="uas">Nilai UAS (40%):</label>
        <input type="number" id="uas" min="0" max="100" placeholder="0 - 100" required>
      </div>

      <button type="button" onclick="prosesHitung()">Hitung Nilai</button>
    </form>

    <div id="pesanError" class="error"></div>

    <div id="hasil">
      <p><strong>Nilai Akhir:</strong> <span id="outNilai"></span></p>
      <p><strong>Predikat:</strong> <span id="outPredikat"></span></p>
      <p><strong>Status Kelulusan:</strong> <span id="outStatus"></span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<form id="formInput">
  <label for="namaSiswa">Nama:</label>
  <input type="text" id="namaSiswa">
  <button type="button" onclick="validasiKosong()">Kirim</button>
</form>
<p id="pesanForm"></p>
